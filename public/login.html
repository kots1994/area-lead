<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AreaLead — ログイン</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 40px;
    width: 360px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.5);
  }
  .logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo-mark { font-size: 40px; }
  .logo-name {
    font-size: 24px;
    font-weight: 700;
    color: #f1f5f9;
    margin-top: 8px;
  }
  .logo-sub { font-size: 13px; color: #64748b; margin-top: 4px; }
  label { display: block; margin-bottom: 16px; }
  label span { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 6px; }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #f1f5f9;
    font-size: 15px;
    outline: none;
    transition: border-color .15s;
  }
  input[type="password"]:focus { border-color: #3b82f6; }
  button {
    width: 100%;
    padding: 13px;
    background: #3b82f6;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 8px;
    transition: background .15s;
  }
  button:hover { background: #2563eb; }
  .error {
    color: #f87171;
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
    min-height: 20px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">📍</div>
    <div class="logo-name">AreaLead</div>
    <div class="logo-sub">倉庫テナント候補リスト自動生成</div>
  </div>
  <form id="login-form">
    <label>
      <span>パスワード</span>
      <input type="password" id="password" autofocus autocomplete="current-password">
    </label>
    <button type="submit">ログイン</button>
    <div class="error" id="error-msg"></div>
  </form>
</div>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = document.getElementById("password").value;
    const err = document.getElementById("error-msg");
    err.textContent = "";
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw }),
    });
    const d = await r.json();
    if (d.ok) {
      location.href = "/";
    } else {
      err.textContent = "パスワードが正しくありません";
    }
  });
</script>
</body>
</html>
