<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン — AreaLead</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
<div class="auth-container">
  <header class="auth-header">
    <div class="brand">
      <span class="brand-mark">📍</span>
      <div>
        <div class="brand-name">AreaLead</div>
        <div class="brand-sub">エリア × 業種で営業アタックリストを自動生成</div>
      </div>
    </div>
  </header>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">ログイン</button>
      <button class="auth-tab" data-tab="register">新規登録</button>
    </div>

    <form id="auth-form" class="auth-form">
      <label class="field">
        <span class="field-label">メールアドレス</span>
        <input type="email" id="auth-email" required autocomplete="email" placeholder="you@example.com">
      </label>
      <label class="field">
        <span class="field-label">パスワード</span>
        <input type="password" id="auth-password" required minlength="8" autocomplete="current-password" placeholder="8文字以上">
      </label>
      <button type="submit" class="btn-primary auth-submit" id="auth-submit">
        <span class="btn-spinner" hidden></span>
        <span class="btn-label">ログイン</span>
      </button>
      <div class="auth-status" id="auth-status"></div>
      <p class="auth-meta" id="auth-meta">
        アカウントをお持ちでない方は<a href="#" id="link-switch-register">新規登録</a>
      </p>
    </form>
  </div>

  <footer class="auth-footer">
    <a href="/landing/index.html">トップ</a> · <a href="/landing/privacy.html">プライバシー</a> · <a href="/landing/tokushoho.html">特定商取引法</a>
  </footer>
</div>

<script src="/login.js"></script>
</body>
</html>
