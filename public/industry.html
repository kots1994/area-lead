<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AreaLead — 業種別エマージング検索</title>
<link rel="stylesheet" href="/style.css?v=5">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div>
        <div class="brand-name">AreaLead</div>
        <div class="brand-sub">業種別エマージング企業 × 倉庫テナント候補</div>
      </div>
    </div>
    <nav class="tab-nav">
      <a href="/" class="tab-link">物件×テナント</a>
      <a href="/industry.html" class="tab-link active">業種別エマージング検索</a>
    </nav>
    <div class="header-plan">
      <button id="btn-open-api-settings" class="user-logout" title="API設定">API設定</button>
    </div>
  </header>

  <main class="main">
    <aside class="sidebar">
      <h2 class="sidebar-title">業界 × 競合除外</h2>
      <form id="search-form" class="form">
        <label class="field">
          <span class="field-label">業界・検索キーワード <span class="req">必須</span></span>
          <textarea id="f-keywords-free" rows="3" placeholder="例: リース, レンタル, 福祉用具（カンマ/改行区切り）" required></textarea>
          <small class="hint">検索語句。複数入れるほど網羅性UP（コスト増）</small>
        </label>

        <label class="field">
          <span class="field-label">除外したい大手・既知の企業名 <span class="opt">任意</span></span>
          <textarea id="f-exclude-free" rows="4" placeholder="例: SMFLレンタル, 三菱HCキャピタル, 三共リース, 日建リース工業, レンタルのニッケン, ヤマシタ, ニシケン, ダイドードリンコ, アサヒ飲料, 日本酒類販売, カクヤス, 伊藤園"></textarea>
          <small class="hint">社名の部分一致で除外</small>
        </label>

        <label class="field">
          <span class="field-label">対象エリア <span class="opt">任意</span></span>
          <div class="chip-input" id="chip-input-wrap">
            <div class="chip-list" id="chip-list"></div>
            <input type="text" id="chip-text" class="chip-text" placeholder="市町村名 → Enter（空欄で全国）">
          </div>
          <input type="hidden" id="f-areas">
          <small class="hint">未入力で全国検索</small>
        </label>

        <details class="advanced">
          <summary>詳細設定</summary>
          <label class="field toggle-field">
            <span>
              <strong>Claude API で優先度判定</strong>
              <small>評価・売上ランク・担当部署をAI推定</small>
            </span>
            <input type="checkbox" id="f-enrich-ai" checked>
          </label>
          <label class="field toggle-field">
            <span>
              <strong>各社サイトをスクレイプ</strong>
              <small>メアド・問い合わせURLを自動取得</small>
            </span>
            <input type="checkbox" id="f-scrape" checked>
          </label>
        </details>

        <button type="submit" class="btn-primary" id="btn-search">
          <span class="btn-spinner" hidden></span>
          <span class="btn-label">リスト生成</span>
        </button>
        <div class="status" id="status"></div>
      </form>
    </aside>

    <section class="results">
      <div class="results-header">
        <h2 id="results-title">結果</h2>
        <div class="results-actions">
          <span class="results-count" id="results-count"></span>
          <button class="btn-secondary" id="btn-csv" hidden>CSVダウンロード</button>
        </div>
      </div>
      <div class="results-table-wrap">
        <table class="results-table" id="results-table">
          <thead>
            <tr>
              <th class="col-pri">★</th>
              <th class="col-rev">売上</th>
              <th>カテゴリ</th>
              <th class="col-name">企業名</th>
              <th class="col-addr">住所</th>
              <th class="col-phone">電話</th>
              <th class="col-web">サイト</th>
              <th class="col-email">メール</th>
              <th class="col-reason">候補理由</th>
            </tr>
          </thead>
          <tbody id="results-body">
            <tr class="empty"><td colspan="9">
              <div class="empty-state">
                <h3>業種とエリアを選択して「リスト生成」を押してください</h3>
                <p>新興/エマージング系の倉庫テナント候補を探します</p>
              </div>
            </td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- API settings modal (same as index) -->
  <div id="api-settings-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <button class="modal-close" id="btn-close-api-settings" aria-label="閉じる">×</button>
      <h2 class="modal-title">API キー設定</h2>
      <p class="modal-sub">キーはブラウザ内のみに保存。サーバーには送信されません。</p>
      <form id="api-settings-form">
        <label class="field">
          <span class="field-label">Google Maps API Key <span class="req">必須</span></span>
          <input type="password" id="key-google" placeholder="AIza..." autocomplete="off">
        </label>
        <label class="field">
          <span class="field-label">Anthropic Claude API Key <span class="opt">任意</span></span>
          <input type="password" id="key-anthropic" placeholder="sk-ant-..." autocomplete="off">
        </label>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="btn-clear-keys">クリア</button>
          <button type="submit" class="btn-primary">保存</button>
        </div>
        <div class="modal-status" id="api-settings-status"></div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-right">v0.3.0 · BYOK</div>
  </footer>
</div>

<script src="/industry.js?v=2"></script>
</body>
</html>
