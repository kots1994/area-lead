<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AreaLead — 倉庫テナント候補リスト自動生成</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">📍</span>
      <div>
        <div class="brand-name">AreaLead</div>
        <div class="brand-sub">倉庫物件 × テナント候補リスト自動生成</div>
      </div>
    </div>
    <div class="header-plan">
      <button id="btn-open-api-settings" class="user-logout" title="API設定">⚙️ API設定</button>
    </div>
  </header>

  <main class="main">
    <aside class="sidebar">
      <h2 class="sidebar-title">物件情報</h2>
      <form id="search-form" class="form">
        <label class="field">
          <span class="field-label">物件名 <span class="req">必須</span></span>
          <input type="text" id="f-name" placeholder="例: SOSiLA海老名" required>
        </label>
        <label class="field">
          <span class="field-label">所在地（住所）</span>
          <input type="text" id="f-address" placeholder="例: 神奈川県海老名市中新田5-18-1">
        </label>
        <label class="field">
          <span class="field-label">物件のフック（USP）</span>
          <textarea id="f-hook" rows="2" placeholder="例: 圏央道海老名IC近接、湘南エリアをカバー、敷地約10,230坪"></textarea>
        </label>
        <label class="field">
          <span class="field-label">対象エリア <span class="req">必須</span></span>
          <input type="text" id="f-areas" placeholder="例: 海老名市, 厚木市, 平塚市, 寒川町" required>
          <small class="hint">カンマ区切りで複数入力（同一市町村+隣接3〜5市町村が目安）</small>
        </label>
        <details class="advanced">
          <summary>詳細設定</summary>
          <label class="field">
            <span class="field-label">検索キーワード</span>
            <input type="text" id="f-keywords" value="物流, 倉庫, 3PL, EC配送, 運輸, 運送, ロジスティクス, 越境EC">
          </label>
          <label class="field toggle-field">
            <span>
              <strong>Claude API で優先度判定</strong>
              <small>★★★/★★☆ 評価・売上ランク・推定担当部署を AI 推定</small>
            </span>
            <input type="checkbox" id="f-enrich-ai" checked>
          </label>
          <label class="field toggle-field">
            <span>
              <strong>各社サイトをスクレイプ</strong>
              <small>メアド・問い合わせフォームURLを自動取得</small>
            </span>
            <input type="checkbox" id="f-scrape" checked>
          </label>
        </details>
        <button type="submit" class="btn-primary" id="btn-search">
          <span class="btn-spinner" hidden></span>
          <span class="btn-label">📡 リスト生成</span>
        </button>
        <div class="status" id="status"></div>
      </form>
    </aside>

    <section class="results">
      <div class="results-header">
        <h2 id="results-title">結果</h2>
        <div class="results-actions">
          <span class="results-count" id="results-count"></span>
          <button class="btn-secondary" id="btn-csv" hidden>📥 CSVダウンロード</button>
        </div>
      </div>
      <div class="results-table-wrap">
        <table class="results-table" id="results-table">
          <thead>
            <tr>
              <th class="col-pri">★</th>
              <th class="col-rev">売上</th>
              <th class="col-name">企業名</th>
              <th class="col-addr">住所</th>
              <th class="col-phone">電話</th>
              <th class="col-web">サイト</th>
              <th class="col-email">メール</th>
              <th class="col-reason">候補理由</th>
            </tr>
          </thead>
          <tbody id="results-body">
            <tr class="empty"><td colspan="8">
              <div class="empty-state">
                <div style="font-size:48px">📡</div>
                <h3>物件情報を入力して「リスト生成」を押してください</h3>
                <p>初回は右上「⚙️ API設定」から Google Maps + Anthropic Claude の API キーを設定してください。</p>
              </div>
            </td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- API settings modal -->
  <div id="api-settings-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <button class="modal-close" id="btn-close-api-settings" aria-label="閉じる">×</button>
      <h2 class="modal-title">API キー設定</h2>
      <p class="modal-sub">あなたのキーはブラウザの localStorage にのみ保存。サーバー側には保存・ログ記録されません。</p>
      <form id="api-settings-form">
        <label class="field">
          <span class="field-label">Google Maps API Key <span class="req">必須</span></span>
          <input type="password" id="key-google" placeholder="AIza..." autocomplete="off">
          <small class="hint">
            <a href="https://console.cloud.google.com/google/maps-apis/credentials" target="_blank" rel="noopener">Google Cloud Console</a> で発行 / Places API (New) を有効化
          </small>
        </label>
        <label class="field">
          <span class="field-label">Anthropic Claude API Key <span class="opt">任意</span></span>
          <input type="password" id="key-anthropic" placeholder="sk-ant-..." autocomplete="off">
          <small class="hint">
            <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Anthropic Console</a> で発行 / 優先度判定に使用
          </small>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="btn-clear-keys">クリア</button>
          <button type="submit" class="btn-primary">保存</button>
        </div>
        <div class="modal-status" id="api-settings-status"></div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-right">v0.2.0 · BYOK</div>
  </footer>
</div>

<script src="/app.js"></script>
</body>
</html>
